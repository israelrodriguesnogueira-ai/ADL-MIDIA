# Branch de produção no Cloudflare Workers Builds: ion/controle-dono.
name = "ion-validacao"
main = "index.mjs"
compatibility_date = "2026-11-10"
workers_dev = true
preview_urls = false
keep_vars = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[ai]
binding = "ION_AI"

[vars]
ION_VISION_FREE_ENABLED = "true"

[[d1_databases]]
binding = "ION_VIDEOS_DB"
database_name = "ion-videos-db"
database_id = "2a7a445a-7dff-467b-ac4c-7199554d9a30"
migrations_dir = "migrations"
