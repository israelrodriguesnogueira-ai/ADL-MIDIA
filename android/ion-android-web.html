<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>ION Android — Comandos</title>
<style>body{font:16px system-ui;background:#101827;color:#f3f6fc;margin:0;padding:18px}main{max-width:700px;margin:auto}textarea{width:100%;box-sizing:border-box;min-height:110px;padding:14px;border-radius:12px;background:#1b293f;color:white;font:inherit}button{padding:14px;margin:5px;border:0;border-radius:12px;font:inherit;background:#b3d6ff;color:#071527}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b293f;padding:16px;border-radius:12px}p{line-height:1.5}#status{color:#e2e8f0}</style>
<script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body><main><h1>ION — Android</h1><p>Comandos de voz e texto com autenticação do proprietário. Nenhuma operação externa é considerada concluída sem resultado.</p><div id="google"></div><p id="status" role="status">Entre com sua conta Google autorizada.</p><label for="pedido">Comando</label><textarea id="pedido" placeholder="Diga ou escreva o que o ION deve executar"></textarea><div><button id="ouvir" disabled>🎤 Ditar</button><button id="enviar" disabled>Executar</button><button id="falar" disabled>🔊 Ouvir resultado</button></div><h2>Resultado</h2><pre id="resultado" aria-live="polite">Aguardando autenticação.</pre></main>
<script>
'use strict';
let token=null, ultimo='';
const el=id=>document.getElementById(id);
const status=msg=>el('status').textContent=msg;
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
function atualizar(){el('enviar').disabled=!token;el('ouvir').disabled=!token||!Speech;}
window.addEventListener('load',()=>{
 if(!window.google?.accounts?.id){status('Login Google indisponível neste navegador.');return;}
 google.accounts.id.initialize({client_id:__ION_GOOGLE_CLIENT_ID__,callback:({credential})=>{token=credential||null;status(token?'Identidade recebida. Comandos exigem validação no servidor.':'Login não realizado.');atualizar();}});
 google.accounts.id.renderButton(el('google'),{theme:'outline',size:'large'});
});
el('ouvir').onclick=()=>{
 if(!Speech||!token)return;
 const recognition=new Speech();recognition.lang='pt-BR';recognition.interimResults=false;
 recognition.onresult=e=>{el('pedido').value=e.results[0][0].transcript;status('Ditado recebido. Pressione Executar.');};
 recognition.onerror=e=>status('Microfone: '+e.error);
 recognition.start();
};
el('enviar').onclick=async()=>{
 const comando=el('pedido').value.trim();
 if(!token||!comando){status('Entre com sua conta e informe um comando.');return;}
 el('enviar').disabled=true;status('Executando solicitação…');el('resultado').textContent='Aguardando resposta do servidor.';
 try{
  const response=await fetch('/api/executar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({comando}),cache:'no-store'});
  const data=await response.json();ultimo=typeof data.texto==='string'?data.texto:JSON.stringify(data,null,2);
  el('resultado').textContent=ultimo;
  status(response.ok?'Resposta recebida. Verifique se houve entrega efetiva.':'Falha HTTP '+response.status+' — tarefa não concluída.');
  if(response.status===401||response.status===403){token=null;atualizar();}
 }catch(e){ultimo='';el('resultado').textContent='Não foi possível conectar ao servidor.';status('Erro de conexão.');}
 finally{atualizar();}
};
el('falar').onclick=()=>{if(!ultimo||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ultimo.slice(0,3500));u.lang='pt-BR';speechSynthesis.speak(u);};
</script></body></html>
