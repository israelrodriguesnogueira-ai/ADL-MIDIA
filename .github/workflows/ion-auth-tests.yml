name: Testes de autenticação ION

on:
  pull_request:
    branches:
      - ion/controle-dono
    paths:
      - "worker-ion/**"
      - "integracoes/ion-controle-dono.mjs"
      - ".github/workflows/ion-auth-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar autenticação e proteção das rotas
        run: node --test worker-ion/index.test.mjs
