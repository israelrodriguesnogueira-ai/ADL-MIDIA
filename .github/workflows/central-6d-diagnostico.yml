name: Central 6D - diagnostico autonomo seguro
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/central-6d-diagnostico.yml"
      - "scripts/aion-supervisor.mjs"
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Executar operadores do Aion
        env:
          AION_MONITORAR_SITE: "1"
        run: node scripts/aion-supervisor.mjs relatorio/diagnostico.md
      - name: Publicar resumo da execucao
        if: always()
        shell: bash
        run: |
          if test -f relatorio/diagnostico.md; then cat relatorio/diagnostico.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Guardar relatorio por 7 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-6d-diagnostico
          path: relatorio/
          retention-days: 7
          if-no-files-found: ignore
