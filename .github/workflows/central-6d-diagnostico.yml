name: Central 6D - diagnostico autonomo seguro
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/central-6d-diagnostico.yml"
      - "scripts/aion-supervisor.mjs"
      - "scripts/finalizar-video.py"
      - "scripts/validar-exportacao.py"
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Executar operadores do Aion
        env:
          AION_MONITORAR_SITE: "1"
        run: node scripts/aion-supervisor.mjs relatorio/diagnostico.md
      - name: Testar exportação de vídeo do Ion
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v espeak-ng >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p relatorio
          ffmpeg -v error -f lavfi -i testsrc2=s=180x320:r=24:d=60 -c:v libx264 -preset ultrafast "$work/base.mp4"
          espeak-ng -v pt-br -w "$work/narracao.wav" "Este é o teste automático de exportação de vídeo do Ion."
          printf '1\n00:00:00,000 --> 00:00:05,000\nTeste automático de exportação do Ion\n' > "$work/legendas.srt"
          python3 scripts/finalizar-video.py "$work/base.mp4" "$work/narracao.wav" "$work/legendas.srt" relatorio/teste-ion-15s.mp4
          python3 scripts/finalizar-video.py "$work/base.mp4" "$work/narracao.wav" "$work/legendas.srt" relatorio/teste-ion-60s.mp4 --duracao 60
          printf '\n- **Exportação de vídeo · Verificado.** Clipes de teste de 15 s e 60 s com narração de teste e legenda.\n' >> relatorio/diagnostico.md
      - name: Publicar resumo da execucao
        if: always()
        shell: bash
        run: |
          if test -f relatorio/diagnostico.md; then cat relatorio/diagnostico.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Guardar relatorio por 7 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-6d-diagnostico
          path: relatorio/
          retention-days: 7
          if-no-files-found: ignore
