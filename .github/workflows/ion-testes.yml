name: ION - Testes de integracao
on:
  pull_request:
    paths:
      - 'worker-ion/**'
      - 'integracoes/ion-controle-dono.mjs'
      - 'tests/ion-video-dispatch.test.mjs'
      - '.github/workflows/ion-testes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: node --check worker-ion/index.mjs
      - name: Testar acesso e comando de video
        run: node --test tests/ion-video-dispatch.test.mjs
