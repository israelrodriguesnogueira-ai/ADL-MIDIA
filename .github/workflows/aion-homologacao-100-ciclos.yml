name: AION - homologacao 100 ciclos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar 100 ciclos e registrar resultados
        run: |
          set -euo pipefail
          mkdir -p relatorio
          node --test tests/aion-homologacao-100-ciclos.test.mjs | tee relatorio/ciclos.log
          {
            echo '## AION — 100 ciclos de homologação'
            echo 'Escopo: executor local, controle de acesso sem credenciais, estados declarados e limites de mídia.'
            echo 'Não comprova login autenticado, produção 3D nem deploy.'
            echo 'Resultado detalhado no artefato ciclos.log.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aion-homologacao-100-ciclos
          path: relatorio/
          retention-days: 7
          if-no-files-found: ignore
