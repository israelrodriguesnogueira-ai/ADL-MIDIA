name: AION - homologacao isolada
on:
  push:
    branches:
      - aion/homologacao-100-ciclos-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar 109 testes locais sem segredos ou deploy
        run: |
          set -euo pipefail
          mkdir -p relatorio
          node --test tests/aion-homologacao-100-ciclos.test.mjs tests/aion-seguranca-limites.test.mjs 2>&1 | tee relatorio/ciclos.log
          {
            echo '## AION - homologacao isolada'
            echo '109 testes definidos: 100 ciclos + 9 verificacoes de seguranca.'
            echo 'Sem credenciais reais, provedores externos, deploy ou publicacao.'
            echo 'Os testes nao comprovam audio, video, login Google ou integracoes reais.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aion-homologacao-isolada
          path: relatorio/
          retention-days: 7
          if-no-files-found: ignore
