name: Testar pipeline de vídeo
on:
  push:
    branches: [feature/video-pipeline-v1]
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/video-pipeline.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de cenas e legendas
        run: node prototype/video-pipeline.test.mjs
