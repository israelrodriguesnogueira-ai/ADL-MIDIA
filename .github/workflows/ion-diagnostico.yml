name: Diagnóstico do ION
# Execução de verificação solicitada em 2026-11-14; sem alterações em segredos ou implantação.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ion-diagnostico.yml]
permissions: {}
concurrency:
  group: ion-diagnostico
  cancel-in-progress: false
jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Capturar eventos de validação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dcedad52c4d58ad2458d1b6aa70fb716
          CAPTURE_SECONDS: '12'
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::O segredo CLOUDFLARE_API_TOKEN não está disponível."
            exit 1
          fi

          cat > "$RUNNER_TEMP/ion-filter.py" <<'PY'
          import json
          import sys

          events = {
              "ion.access_check_started": {},
              "ion.google_keys_unavailable": {
                  "reason": {"network_failure", "http_failure"},
                  "errorType": {"timeout", "fetch_type_error", "other"},
              },
              "ion.google_verification_error": {
                  "stage": {"key_response", "key_import", "signature_verification"},
              },
              "ion.auth_configuration_invalid": {},
              "ion.owner_access_denied": {
                  "reason": {"verificador_indisponivel", "sessao_ausente_ou_invalida", "identidade_sem_permissao"},
              },
          }

          payload = []
          for line in sys.stdin:
              if not payload and not line.startswith("{"):
                  continue
              payload.append(line)
              try:
                  invocation = json.loads("".join(payload))
              except json.JSONDecodeError:
                  if line.rstrip() == "{":
                      payload = [line]
                  if len(payload) > 2000 or line.rstrip() == "}":
                      payload = []
                  continue
              payload = []
              if not isinstance(invocation, dict):
                  continue
              request = (invocation.get("event") or {}).get("request") or {}
              if request.get("url") != "https://ion-validacao.israelrodriguesnogueira.workers.dev/verificar-acesso":
                  continue
              for entry in invocation.get("logs", []):
                  for message in entry.get("message", []):
                      try:
                          event = json.loads(message) if isinstance(message, str) else message
                      except json.JSONDecodeError:
                          continue
                      if not isinstance(event, dict):
                          continue
                      name = event.get("event")
                      if not isinstance(name, str) or name not in events:
                          continue
                      output = {"event": name}
                      for key, allowed in events[name].items():
                          value = event.get(key)
                          if isinstance(value, str) and value in allowed:
                              output[key] = value
                      print(json.dumps(output), flush=True)
          PY

          cat > "$RUNNER_TEMP/ion-tail.mjs" <<'JS'
          const workerUrl = "https://ion-validacao.israelrodriguesnogueira.workers.dev/verificar-acesso";
          const endpoint = "https://api.cloudflare.com/client/v4/accounts/" +
            process.env.CLOUDFLARE_ACCOUNT_ID + "/workers/scripts/ion-validacao/tails";
          const headers = {
            Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
            "Content-Type": "application/json",
          };
          async function api(url, method) {
            return fetch(url, {
              method, headers, redirect: "error",
              body: method === "POST" ? JSON.stringify({ filters: [] }) : undefined,
              signal: AbortSignal.timeout(10000),
            });
          }
          const verifyUrl = "https://api.cloudflare.com/client/v4/user/tokens/verify";
          const verification = await api(verifyUrl, "GET");
          const tokenInfo = await verification.json();
          if (!verification.ok || !tokenInfo.success || tokenInfo.result?.status !== "active") {
            const codes = (tokenInfo.errors ?? []).map(({ code }) => code).filter(Number.isInteger);
            const status = tokenInfo.result?.status;
            console.error("Verificação do token da conta: HTTP " + verification.status +
              " | códigos: " + codes.join(", ") +
              (["disabled", "expired"].includes(status) ? " | estado: " + status : ""));
            process.exit(1);
          }
          console.error("Token da conta confirmado como ativo.");
          const response = await api(endpoint, "POST");
          const body = await response.json();
          if (!response.ok || !body.success) {
            const codes = (body.errors ?? []).map(({ code }) => code).filter(Number.isInteger);
            console.error("API Cloudflare: HTTP " + response.status + " | códigos: " + codes.join(", "));
            process.exit(1);
          }
          const { id, url } = body.result;
          console.error("Cloudflare aceitou o token e criou a sessão de logs.");
          try {
            const socketUrl = new URL(url);
            if (socketUrl.protocol !== "wss:") throw new Error("Protocolo inesperado");
            const socket = new WebSocket(socketUrl, "trace-v1");
            socket.binaryType = "arraybuffer";
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                socket.close();
                reject(new Error("tempo de conexão excedido"));
              }, 10000);
              socket.addEventListener("open", () => {
                clearTimeout(timer);
                resolve();
              }, { once: true });
              socket.addEventListener("error", () => {
                clearTimeout(timer);
                reject(new Error("falha na conexão WebSocket"));
              }, { once: true });
            });
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                resolve();
                socket.close();
              }, Number(process.env.CAPTURE_SECONDS) * 1000);
              socket.addEventListener("message", ({ data }) => {
                if (typeof data === "string") console.log(data);
                else if (data instanceof ArrayBuffer) console.log(Buffer.from(data).toString("utf8"));
              });
              socket.addEventListener("close", () => {
                clearTimeout(timer);
                reject(new Error("captura encerrada antes do prazo"));
              });
              socket.send(JSON.stringify({ debug: false }));
              console.error("Captura conectada.");
              setTimeout(async () => {
                try {
                  const probe = await fetch(workerUrl, { signal: AbortSignal.timeout(10000) });
                  console.error("Teste sem login: HTTP " + probe.status);
                } catch {
                  console.error("Falha no teste sem login.");
                }
              }, 1500);
            });
          } catch {
            console.error("A API aceitou o token, mas a captura ao vivo falhou.");
            process.exitCode = 1;
          } finally {
            if (typeof id === "string" && /^[a-zA-Z0-9-]+$/.test(id)) {
              await api(endpoint + "/" + id, "DELETE").catch(() => {});
            }
            // Encerra a captura mesmo se o WebSocket mantiver recursos ativos.
            process.exit(process.exitCode ?? 0);
          }
          JS

          timeout --signal=TERM --kill-after=5s 90s node "$RUNNER_TEMP/ion-tail.mjs" | python -u "$RUNNER_TEMP/ion-filter.py" | tee "$RUNNER_TEMP/ion-events"
          if ! grep -q '"event": "ion.access_check_started"' "$RUNNER_TEMP/ion-events"; then
            echo "::error::Nenhum evento de validação foi recebido durante a captura."
            exit 1
          fi
