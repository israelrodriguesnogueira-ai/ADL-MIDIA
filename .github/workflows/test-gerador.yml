name: Verificar gerador ADL Mídia
on:
  pull_request:
    paths:
      - 'gerador.html'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/test-gerador.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e recursos
        run: node tests/validate-generator.cjs
