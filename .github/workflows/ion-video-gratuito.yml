name: ION - teste gratuito de exportação MP4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ion-video-gratuito.py
      - tests/test_ion_video.py
      - ion-central-comandos.html
      - .github/workflows/ion-video-gratuito.yml
permissions:
  contents: read
jobs:
  video-gratuito:
    if: github.repository == 'israelrodriguesnogueira-ai/ADL-MIDIA'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe do gerador
        run: python3 -m py_compile scripts/ion-video-gratuito.py
      - name: Executar testes unitarios do ION
        run: python3 -m unittest discover -s tests -p 'test_ion_video.py' -v
      - name: Instalar FFmpeg gratuito
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Verificar ferramentas gratuitas
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Verificar FFmpeg e FFprobe
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Preparar voz neural Faber em português brasileiro
        run: |
          python3 -m venv "$RUNNER_TEMP/ion-voice"
          source "$RUNNER_TEMP/ion-voice/bin/activate"
          python -m pip install piper-tts==1.8.0
          model="$RUNNER_TEMP/pt_BR-faber-medium.onnx"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/6b9cfaacb4fb2e02a9621227e3c1a48bec9710c3/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx"
          curl -fsSL --retry 2 --max-time 90 "$base?download=true" -o "$model"
          curl -fsSL --retry 2 --max-time 30 "$base.json" -o "$model.json"
          printf '%s  %s\n' 75e913eb463db0b6ac7ddf68d3e4c9ac19ace36dc3b710a81039b448352b8ffc "$model" fa8a8fecb01ae198bc416381e368d3206f85bad1449a0f11e1f6a9edf85a32f1 "$model.json" | sha256sum -c -
          echo "ION_PIPER_MODEL=$model" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ion-voice/bin" >> "$GITHUB_PATH"
      - name: Gerar MP4 vertical sem API paga
        run: python3 scripts/ion-video-gratuito.py --voz piper
      - name: Validar duração, resolução e fluxos
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json saida/ion-transito-15s.mp4
      - name: Registrar diagnostico de exportacao
        if: always()
        run: |
          if test -f saida/ion-transito-15s.mp4; then
            ls -lh saida/ion-transito-15s.mp4
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,width,height -of json saida/ion-transito-15s.mp4
          else
            echo "MP4 ausente: verificar etapa anterior nos logs."
          fi
      - name: Disponibilizar arquivo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ion-video-gratuito-15s
          path: saida/ion-transito-15s.mp4
          retention-days: 7
