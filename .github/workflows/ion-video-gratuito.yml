name: ION - teste gratuito de exportação MP4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ion-video-gratuito.py
      - .github/workflows/ion-video-gratuito.yml
permissions:
  contents: read
jobs:
  video-gratuito:
    if: github.repository == 'israelrodriguesnogueira-ai/ADL-MIDIA'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg gratuito
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Verificar ferramentas gratuitas
        run: |
          command -v espeak-ng
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Verificar FFmpeg e FFprobe
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Gerar MP4 vertical sem API paga
        run: python3 scripts/ion-video-gratuito.py
      - name: Validar duração, resolução e fluxos
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json saida/ion-transito-15s.mp4
      - name: Disponibilizar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ion-video-gratuito-15s
          path: saida/ion-transito-15s.mp4
          retention-days: 7
