name: ION executor local - testes
on:
  pull_request:
    paths:
      - 'integracoes/ion-motor-worker.mjs'
      - 'integracoes/ion-executor-local.mjs'
      - 'integracoes/ion-comando-natural-local.mjs'
      - 'integracoes/ion-roteador-operadores.mjs'
      - 'tests/ion-*.test.mjs'
      - '.github/workflows/ion-executor-local-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar executor, rota e separacao de diagnosticos
        run: node --test tests/ion-executor-local.test.mjs tests/ion-worker-executor.test.mjs tests/ion-diagnostico-separado.test.mjs tests/ion-comando-natural-local.test.mjs tests/ion-markdown-local.test.mjs tests/ion-download-artefatos.test.mjs tests/ion-homologacao-seguranca.test.mjs tests/ion-homologacao-negativa.test.mjs tests/ion-40-casos-regressao.test.mjs tests/ion-40-limites-entrada.test.mjs tests/ion-estado-operadores.test.mjs
      - name: Verificar Preview HTTP sem credenciais
        env:
          PREVIEW_URL: https://aion-estado-operadores-20261118-adl-midia.israelrodriguesnogueira.workers.dev
        run: |
          set -eu
          health=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/health")
          test "$health" = "200" || { echo "Health HTTP $health (esperado 200)"; exit 1; }
          for path in /api/comando /api/executar-local; do
            status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"acao":"estado_operadores","comando":"estado dos operadores"}' "$PREVIEW_URL$path")
            test "$status" = "401" || { echo "$path HTTP $status (esperado 401)"; exit 1; }
          done
          echo "Preview HTTP: health 200; rotas privadas 401 sem credenciais"
