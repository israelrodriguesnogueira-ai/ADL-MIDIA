name: ION executor local - testes
on:
  pull_request:
    paths:
      - 'integracoes/ion-motor-worker.mjs'
      - 'integracoes/ion-executor-local.mjs'
      - 'integracoes/ion-comando-natural-local.mjs'
      - 'integracoes/ion-roteador-operadores.mjs'
      - 'tests/ion-*.test.mjs'
      - '.github/workflows/ion-executor-local-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar executor, rota e separacao de diagnosticos
        run: node --test tests/ion-executor-local.test.mjs tests/ion-worker-executor.test.mjs tests/ion-diagnostico-separado.test.mjs tests/ion-comando-natural-local.test.mjs tests/ion-markdown-local.test.mjs tests/ion-download-artefatos.test.mjs tests/ion-homologacao-seguranca.test.mjs tests/ion-estado-operadores.test.mjs
