name: AION - executor seguro (testes)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integracoes/aion-executor-seguro.mjs'
      - 'testes/aion-executor-seguro.test.mjs'
      - '.github/workflows/aion-executor-seguro.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test testes/aion-executor-seguro.test.mjs
