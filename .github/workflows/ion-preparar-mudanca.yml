name: Aion - Preparar ajuste da interface

on:
  workflow_dispatch:
    inputs:
      ajuste:
        description: Ajuste a preparar
        type: choice
        default: velocidade
        options: [velocidade, icones, historico]
      valor:
        description: Tamanho dos ícones ou largura mínima do histórico em px
        type: string
      velocidade:
        description: Velocidade padrão do leitor Faber
        default: "1"
        type: choice
        options: ['0.75', '1', '1.25', '1.5', '2']

permissions:
  contents: write

jobs:
  proposta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ion/controle-dono
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar a alteração permitida
        env:
          AJUSTE: ${{ inputs.ajuste }}
          VALOR: ${{ inputs.valor }}
          VELOCIDADE: ${{ inputs.velocidade }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ajuste = os.environ["AJUSTE"]
          valor = os.environ["VALOR"]
          arquivo = Path("worker-ion/index.mjs")
          codigo = arquivo.read_text(encoding="utf-8")

          def substituir_unico(texto, padrao, substituto):
              atualizado, total = re.subn(padrao, substituto, texto, flags=re.DOTALL)
              if total != 1:
                  raise SystemExit("Controle esperado não encontrado uma única vez")
              return atualizado

          if ajuste == "velocidade":
              velocidade = os.environ["VELOCIDADE"]
              if velocidade not in {"0.75", "1", "1.25", "1.5", "2"}:
                  raise SystemExit("Velocidade inválida")
              def selecionar(match):
                  abertura, opcoes, fechamento = match.groups()
                  opcao = f'<option value="{velocidade}">'
                  opcoes = substituir_unico(
                      opcoes.replace(" selected", ""), re.escape(opcao),
                      f'<option value="{velocidade}" selected>'
                  )
                  return abertura + opcoes + fechamento
              atualizado = substituir_unico(codigo, r'(<select id="leitura-velocidade"[^>]*>)(.*?)(</select>)', selecionar)
          elif ajuste == "icones" and valor in {"14", "16", "18", "20"}:
              atualizado = substituir_unico(
                  codigo,
                  r'\.ion-resposta-acoes svg \{ width: \d+px; height: \d+px; \}',
                  f'.ion-resposta-acoes svg {{ width: {valor}px; height: {valor}px; }}'
              )
          elif ajuste == "historico" and valor in {"800", "900", "1024"}:
              media = f'(min-width: {valor}px)'
              atualizado = substituir_unico(codigo, r'@media \(min-width: \d+px\)(?= \{\s+main:has)', f'@media {media}')
              atualizado = substituir_unico(atualizado, r'window\.matchMedia\("\(min-width: \d+px\)"\)', f'window.matchMedia("{media}")')
          else:
              raise SystemExit("Ajuste ou valor inválido")
          arquivo.write_text(atualizado, encoding="utf-8")
          PY
      - name: Validar a proposta
        run: |
          node --check worker-ion/index.mjs
          node --test tests/*.test.mjs testes/*.test.mjs
          git diff --check
      - name: Disponibilizar versão para revisão
        run: |
          if git diff --quiet; then
            echo 'O valor pedido já está configurado.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="aion/proposta-interface-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-ion/index.mjs
          git commit -m "Ajusta a interface do Aion"
          git push origin "HEAD:refs/heads/$branch"
          printf 'Testes concluídos. [Revisar alteração e abrir proposta](%s/%s/compare/ion/controle-dono...%s?expand=1). A incorporação a ion/controle-dono é a aprovação de publicação.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
