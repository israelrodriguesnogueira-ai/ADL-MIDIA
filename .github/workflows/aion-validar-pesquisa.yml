name: AION - validar pesquisa externa
on:
  push:
    branches:
      - aion/centralizacao-pesquisa-video-20261120
    paths:
      - src/aion-pesquisa-externa.mjs
      - tests/aion-pesquisa-externa.test.mjs
      - .github/workflows/aion-validar-pesquisa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar integracao externa sem expor credenciais
        run: node --test tests/aion-pesquisa-externa.test.mjs
