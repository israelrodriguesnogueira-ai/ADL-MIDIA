<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADL Mídia | Gerador experimental</title><style>body{font-family:system-ui;background:#101827;color:#f5f7ff;max-width:980px;margin:auto;padding:24px}a{color:#8fc5ff}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;margin:7px 0 14px;border-radius:8px;border:1px solid #51627b;background:#1d2b40;color:white}button{background:#7ab8ff;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}canvas{max-width:100%;max-height:520px;display:block;margin:16px auto;background:#192a45}label{font-weight:600}p{color:#c0cee1}.card{background:#182338;border-radius:15px;padding:18px;margin:15px 0}</style><h1>ADL Mídia — gerador experimental</h1><p><a href="index.html">Voltar ao painel</a></p><p>Crie um vídeo vertical simples com até seis cenas de texto animado, sem custos de API. A exportação será em MP4 ou WebM conforme o navegador. Não inclui voz, imagens ou música.</p><div class="card"><label for="title">Título</label><input id="title" value="A coragem de recomeçar" maxlength="80"><label for="category">Pilar</label><select id="category"><option>Fé e superação</option><option>Automotivo</option><option>Curiosidades</option></select><label for="scenes">Cenas (uma frase por linha, até 6)</label><textarea id="scenes" rows="7">Nem todo recomeço começa com uma vitória.
Solte o peso de ontem.
Perdoar não apaga o passado.
Mas abre espaço para a paz.
Dê mais um passo.
Recomeçar é coragem. Perdoar é liberdade.</textarea><label for="seconds">Segundos por cena (2 a 8)</label><input id="seconds" type="number" min="2" max="8" value="4"><button id="generate">Gerar vídeo</button><p id="status" role="status">Pronto para gerar.</p></div><canvas id="canvas" width="540" height="960" aria-label="Prévia do vídeo vertical"></canvas><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');
function wrap(text,max){const words=text.split(/\s+/),lines=[];let line='';for(const word of words){if(ctx.measureText(line?line+' '+word:word).width>max&&line){lines.push(line);line=word}else line=line?line+' '+word:word}if(line)lines.push(line);return lines.slice(0,8)}
function draw(text,index,total,progress){const grd=ctx.createLinearGradient(0,0,540,960);const colors=[['#142b50','#0b1429'],['#3a244e','#101b37'],['#193b44','#0e172e']];const palette=colors[index%colors.length];grd.addColorStop(0,palette[0]);grd.addColorStop(1,palette[1]);ctx.fillStyle=grd;ctx.fillRect(0,0,540,960);ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(390,260,180+progress*18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#91c9ff';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('ADL MÍDIA',270,95);ctx.fillStyle='#fff';ctx.font='bold 38px system-ui';const lines=wrap(text,445),lineHeight=52;let y=480-(lines.length-1)*lineHeight/2;for(const line of lines){ctx.fillText(line,270,y);y+=lineHeight}ctx.fillStyle='#a9c1dc';ctx.font='20px system-ui';ctx.fillText($('category').value,270,840);ctx.fillStyle='#8bbcff';ctx.fillRect(48,885,444*(index+progress)/total,6)}
function supported(){return !!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream)}
$('generate').onclick=async()=>{if(!supported()){ $('status').textContent='Este navegador não oferece gravação por MediaRecorder/canvas.';return}const scenes=$('scenes').value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,6);if(!scenes.length){$('status').textContent='Digite pelo menos uma cena.';return}const sec=Math.max(2,Math.min(8,Number($('seconds').value)||4));const btn=$('generate');btn.disabled=true;let stream,recorder;try{stream=c.captureStream(15);const types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('Este navegador não suporta exportação de vídeo por MediaRecorder. Tente Chrome ou Safari atualizado.');recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const finished=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=()=>reject(Error('Falha na gravação'))});recorder.start(500);const start=performance.now(),duration=scenes.length*sec*1000;await new Promise(resolve=>{function frame(now){const elapsed=Math.min(now-start,duration),index=Math.min(scenes.length-1,Math.floor(elapsed/(sec*1000))),progress=Math.min(1,(elapsed-index*sec*1000)/(sec*1000));draw(scenes[index],index,scenes.length,progress);$('status').textContent='Gerando: '+Math.round(elapsed/duration*100)+'%';if(elapsed<duration)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});recorder.stop();await finished;const blob=new Blob(chunks,{type:mime});if(blob.size<1000)throw Error('Arquivo gerado vazio');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='adl-midia-'+Date.now()+(mime.startsWith('video/mp4')?'.mp4':'.webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='Vídeo exportado ('+Math.round(blob.size/1024)+' KB). Confira o arquivo antes de publicar.'}catch(e){$('status').textContent='Erro: '+e.message;if(recorder&&recorder.state==='recording')recorder.stop()}finally{if(stream)stream.getTracks().forEach(t=>t.stop());btn.disabled=false}};draw('A coragem de recomeçar',0,6,0);
</script></html>
